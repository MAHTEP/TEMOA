name: temoa
channels:
  - defaults
  - conda-forge
  - gurobi
dependencies:
  - python=3.7.3
  - pip=22.3.1
 
  # core model + solvers
  - pyomo=5.5.1
  - pyomo.extras=3.3
  - pyutilib=5.8.0
  - glpk=4.65
  - gurobi=10.0.3
 
  # scientific stack
  - numpy=1.21.5
  - scipy=1.7.3
  - pandas=1.3.5
  - networkx=2.6.3
  - joblib=1.1.1
  - salib=1.4.5
  - pydoe=0.3.8
  - wquantiles=0.6
  - pint=0.18
  - pyam=1.9.0
  - pathos=0.3.2
 
  # plotting / graphs
  - matplotlib=3.5.3
  - seaborn=0.12.2
  - plotly=5.9.0
  - graphviz
  - python-graphviz=0.20.1
 
  # I/O
  - openpyxl=3.0.10
  - xlrd=2.0.1
  - xlwt=1.3.0
  - xlsxwriter=3.0.3
  - tabulate=0.8.10
  - sqlalchemy=1.4.39
  - pymysql=1.0.2
  - pyodbc=4.0.34
  - lxml=4.9.1
  - datapackage=1.15.2
 
  # notebooks
  - ipython=7.31.1
  - ipykernel=6.15.2
  - jupyter=1.0.0
  - jupyterlab=3.5.3
  - notebook=6.5.2
  - jupyter_contrib_nbextensions=0.7.0
 
  # documentation
  - sphinx=5.0.2
  - sphinx_rtd_theme=0.4.3
  - sphinxcontrib-htmlhelp=2.0.0
  - sphinxcontrib-serializinghtml=1.1.5
  - sphinxcontrib-bibtex=2.6.3
 
  - pip:
      - highspy==1.5.3
      - scikit-learn==1.0.2
      - threadpoolctl==3.1.0
      - tqdm==4.67.1